<style>
.card{
    transition: all 0.3s ease;

.card:hover{

}

.destaque{
    width: fit-content;

}
 .boas-vindas{

    margin: 20px auto 35px auto;
    text-align: center;
    color: white;
    animation: subir 1.5s ease-out;
}

.boas-vindas h2{
    color: #6ee7ff;
    margin-bottom: 15px;
    font-size: 32px;
}

.boas-vindas p{
    font-size: 20px;
    line-height: 1.7;
    color: #d1d5db;
    font-family: 'poppins';
}

@keyframes subir{
    from{
        opacity: 0;
        transform: translateY(40px);
    }

    to{
        opacity: 1;
        transform: translateY(0);
    }
}
